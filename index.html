<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svgs/logo-nobg-color.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Fawe</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var validThemes = ["light", "dark", "light-old", "dark-old"];
          var theme = localStorage.getItem("theme");
          if (!theme || validThemes.indexOf(theme) === -1) {
            var prefersDark =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            theme = prefersDark ? "dark" : "light";
          }

          // Keep data-theme consistent as early as possible
          document.documentElement.setAttribute("data-theme", theme);

          // Set status bar color to match navbar/background (bg-main)
          var themeToColor = {
            light: "#fff8f5",
            dark: "#181416",
            "light-old": "#ffffff",
            "dark-old": "#000000",
          };
          var color = themeToColor[theme] || "#ffffff";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement("meta");
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          meta.setAttribute("content", color);
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json?v=2" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
